name = "plus15-ai"
main = "worker.js"
compatibility_date = "2026-09-01"

# The key is a secret, never in this file: `wrangler secret put NVIDIA_API_KEY`.
# Local dev reads it from a gitignored .dev.vars (NVIDIA_API_KEY=nvapi-...).

# Per-IP request cap (Cloudflare's built-in rate limiter; period is 10 or 60 s).
[[ratelimits]]
name = "LIMITER"
namespace_id = "1501"
simple = { limit = 20, period = 60 }
